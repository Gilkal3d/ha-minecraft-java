name: MC Modded Server
version: "1.0.0"
slug: mc_modded
description: Servidor Minecraft Java com Fabric, NeoForge ou Forge + painel web (console, server.properties, whitelist e mods)
url: https://github.com/Gilkal3d/ha-minecraft-java
arch:
  - amd64
  - aarch64
init: false
startup: system
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cube-outline
panel_title: MC Server

ports:
  "25565/tcp": 25565
ports_description:
  "25565/tcp": Porta do servidor Minecraft Java

options:
  eula: false
  loader: FABRIC
  minecraft_version: "1.21.4"
  memory: 4G
  aikar_flags: true
  motd: Servidor Minecraft do Home Assistant
  max_players: 10
  online_mode: true
  difficulty: easy
  gamemode: survival
  pvp: true
  allow_nether: true
  enable_command_block: false
  level_name: world
  level_type: "minecraft:normal"
  view_distance: 10
  whitelist: []
  ops: []
  modrinth_projects: []
  rcon_password: ""

schema:
  eula: bool
  loader: list(FABRIC|FORGE|NEOFORGE|VANILLA|PAPER|PURPUR)
  minecraft_version: str
  memory: str
  aikar_flags: bool
  motd: str
  max_players: int
  online_mode: bool
  difficulty: list(peaceful|easy|normal|hard)
  gamemode: list(survival|creative|adventure|spectator)
  pvp: bool
  allow_nether: bool
  enable_command_block: bool
  level_name: str
  level_type: str
  view_distance: int
  whitelist: [str]
  ops: [str]
  modrinth_projects: [str]
  rcon_password: str?
