name: MC Modded Server
version: "1.2.4"
slug: mc_modded
description: Servidor Minecraft Java com Fabric, NeoForge ou Forge + painel web (visão geral, console, jogadores, backups, agendamentos, server.properties e mods)
url: https://github.com/Gilkal3d/ha-minecraft-java
arch:
  - amd64
  - aarch64
# init: true => tini como PID 1: repassa sinais (parada limpa) e reapara
# processos zumbis do Java. Essencial para o add-on encerrar sem SIGKILL.
init: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cube-outline
panel_title: MC Server
# Watchdog: se o painel web parar de responder, o Supervisor reinicia o add-on
watchdog: http://[HOST]:[PORT:8099]/api/status

# homeassistant_api: true => o Supervisor injeta SUPERVISOR_TOKEN e libera o
# endpoint http://supervisor/core/api. Usado pelo painel para publicar sensores
# (status, jogadores, RAM) e enviar notificações no Home Assistant.
homeassistant_api: true

ports:
  "25565/tcp": 25565
ports_description:
  "25565/tcp": Porta do servidor Minecraft Java

options:
  eula: false
  loader: FABRIC
  minecraft_version: "1.21.4"
  memory: 4G
  aikar_flags: true
  motd: Servidor Minecraft do Home Assistant
  max_players: 10
  online_mode: true
  difficulty: easy
  gamemode: survival
  pvp: true
  allow_nether: true
  enable_command_block: false
  level_name: world
  level_type: "minecraft:normal"
  view_distance: 10
  whitelist: []
  ops: []
  modrinth_projects: []
  rcon_password: ""
  # Agendamentos (formato HH:MM, 24h). Vazio = desativado.
  daily_restart: ""
  daily_backup: ""
  backup_keep: 7
  # Notificações no Home Assistant (entrou/saiu, backup, caiu/religou).
  notifications: false
  notify_service: ""

schema:
  eula: bool
  loader: list(FABRIC|FORGE|NEOFORGE|VANILLA|PAPER|PURPUR)
  minecraft_version: str
  memory: str
  aikar_flags: bool
  motd: str
  max_players: int
  online_mode: bool
  difficulty: list(peaceful|easy|normal|hard)
  gamemode: list(survival|creative|adventure|spectator)
  pvp: bool
  allow_nether: bool
  enable_command_block: bool
  level_name: str
  level_type: str
  view_distance: int
  whitelist: [str]
  ops: [str]
  modrinth_projects: [str]
  rcon_password: str?
  daily_restart: str?
  daily_backup: str?
  backup_keep: int
  notifications: bool
  notify_service: str?
